name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**"]
  pull_request:
    branches: [main]
    paths: ["backend/**"]

jobs:
  lint:
    name: Laravel Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, gd, bcmath, intl, pdo_pgsql, pgsql
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: backend-pint-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: vendor/bin/pint --test
        working-directory: backend

  security:
    name: Composer Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, gd, bcmath, intl, pdo_pgsql, pgsql
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: backend-audit-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: composer audit
        working-directory: backend

  tests:
    name: Pest / PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, zip, gd, bcmath, intl, pdo_pgsql, pgsql, sqlite3
      - uses: actions/cache@v4
        with:
          path: backend/vendor
          key: backend-tests-${{ hashFiles('backend/composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
        working-directory: backend
      - run: cp .env.example .env
        working-directory: backend
      - run: php artisan key:generate
        working-directory: backend
      - run: php artisan test
        working-directory: backend
