name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.ivoiretourvillage.org/api

  backend-build:
    name: Build backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pgsql, zip, gd, bcmath, intl
      - run: composer install --no-interaction --prefer-dist
        working-directory: backend
      - run: cp .env.example .env && php artisan key:generate
        working-directory: backend

  deploy:
    name: Deploy to production
    needs: [frontend-build, backend-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        run: |
          if [ -z "${{ secrets.DEPLOY_HOST }}" ]; then echo "::error::Missing secret DEPLOY_HOST"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_USER }}" ]; then echo "::error::Missing secret DEPLOY_USER"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then echo "::error::Missing secret DEPLOY_SSH_KEY"; exit 1; fi
          if [ -z "${{ secrets.DEPLOY_PATH }}" ]; then echo "::error::Missing secret DEPLOY_PATH"; exit 1; fi
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            test -f backend/.env || { echo "::error::backend/.env is missing on the server"; exit 1; }
            test -f .env || { echo "::error::Root .env is missing on the server (needs DOMAIN, API_DOMAIN, NEXT_PUBLIC_API_URL)"; exit 1; }
            git pull origin main
            docker compose -f docker-compose.prod.yml build
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
