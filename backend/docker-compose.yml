services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./:/var/www/html
      # vendor/, storage/ and bootstrap/cache/ moved to named volumes: on
      # Windows, Docker Desktop's bind-mount translation makes the heavy
      # file I/O of the PHP autoloader and Laravel's caches extremely slow.
      # Keeping them on native container storage instead fixes request times.
      - app_vendor:/var/www/html/vendor
      - app_storage:/var/www/html/storage
      - app_bootstrap_cache:/var/www/html/bootstrap/cache
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ivoire_tour_village
      POSTGRES_USER: itv
      POSTGRES_PASSWORD: itv_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  app_vendor:
  app_storage:
  app_bootstrap_cache:
