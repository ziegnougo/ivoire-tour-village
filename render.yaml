services:
  - type: postgres
    name: ivoire-tour-postgres
    plan: starter
    databaseName: ivoire_tour_village
    user: itv

  - type: redis
    name: ivoire-tour-redis
    plan: starter

  - type: web
    name: ivoire-tour-backend
    plan: starter
    dockerfilePath: backend/Dockerfile.render
    envVars:
      - key: APP_NAME
        value: Ivoire-Tour Village
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        value: https://api.ivoiretourvillage.org
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: BCRYPT_ROUNDS
        value: 12
      - key: LOG_CHANNEL
        value: stack
      - key: LOG_STACK
        value: single
      - key: LOG_DEPRECATIONS_CHANNEL
        value: null
      - key: LOG_LEVEL
        value: error
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_LIFETIME
        value: 120
      - key: SESSION_ENCRYPT
        value: false
      - key: SESSION_PATH
        value: /
      - key: SESSION_DOMAIN
        value: .ivoiretourvillage.org
      - key: BROADCAST_CONNECTION
        value: log
      - key: FILESYSTEM_DISK
        value: local
      - key: QUEUE_CONNECTION
        value: database
      - key: CACHE_STORE
        value: database
      - key: REDIS_CLIENT
        value: phpredis
      - key: REDIS_HOST
        value: ivoire-tour-redis
      - key: REDIS_PORT
        value: 6379
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtps
      - key: MAIL_HOST
        value: smtp.zoho.com
      - key: MAIL_PORT
        value: 465
      - key: MAIL_USERNAME
        value: contact@ivoiretourvillage.org
      - key: MAIL_PASSWORD
        value: CHANGE_ME
      - key: MAIL_FROM_ADDRESS
        value: contact@ivoiretourvillage.org
      - key: MAIL_FROM_NAME
        value: Ivoire-Tour Village
      - key: CORS_ALLOWED_ORIGINS
        value: https://ivoiretourvillage.org
      - key: AWS_ACCESS_KEY_ID
        value: ""
      - key: AWS_SECRET_ACCESS_KEY
        value: ""
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: AWS_BUCKET
        value: ""
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: false
